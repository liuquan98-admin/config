 
# ========== 剪贴板系统交互 ==========
clipboard_control write-clipboard read-clipboard

# ========== 鼠标行为优化 ==========
# Ctrl+鼠标左键 直接打开链接
mouse_map ctrl+left click open_url
# 选中即自动复制到系统剪贴板
copy_on_select yes
# 终端内链接识别样式
url_style curly
# 鼠标选中自动复制开关
mouse_select_copy yes

			#d-- 关闭多余扩展，避免额外报错

clipboard_control read-clipboard write-clipboard
#clipboard_control read-clipboard write-clipboard
map ctrl+shift+v paste_from_clipboard



